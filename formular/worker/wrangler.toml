name = "dk-formular"
main = "src/worker.js"
compatibility_date = "2026-08-31"

# Kein Zugriff auf fremde Dienste außer MailerSend, keine Datenbank,
# kein Zustand außer dem Zähler des Rate Limits.

[vars]
# Von welchen Adressen darf das Formular senden? Komma-getrennt.
ERLAUBTE_HERKUNFT = "https://dk-dk.de,https://www.dk-dk.de,https://agentur-dk.github.io"

# Absender. Muss zur in MailerSend verifizierten Sendedomain gehören.
VON_ADRESSE = "formular@test-69oxl5e5802l785k.mlsender.net"
VON_NAME    = "Website-Formular"

# Empfänger der Anfragen.
AN_ADRESSE = "d.kontelis@dk-dk.de"
AN_NAME    = "agentur dk"

# Anfragen pro IP und Stunde.
LIMIT_PRO_STUNDE = "5"

# Der Token steht NICHT in dieser Datei. Er wird als Secret gesetzt und
# liegt verschlüsselt bei Cloudflare — das ist der einzige Schritt, bei
# dem etwas Geheimes die Hand wechselt:
#
#   npx wrangler secret put MAILERSEND_TOKEN
#
# Optional: Rate Limit pro IP. Ohne diesen Block greifen die übrigen fünf
# Stufen weiterhin, es entfällt nur die sechste. Wer ihn will:
#
#   npx wrangler kv namespace create RATE_LIMIT
#
# gibt eine id aus; dann die drei Zeilen einkommentieren und die id
# eintragen.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "HIER_DIE_ID_EINTRAGEN"
