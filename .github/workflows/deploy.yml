name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/lastmod.ts liest das Datum des letzten Commits je Seite für
          # die Sitemap. Mit dem Standard-Shallow-Checkout stünde für jede
          # Datei derselbe Zeitpunkt — Google ignoriert solche lastmod-Werte.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run check:types

      - name: Unit-Tests
        run: npm test

      # Preview-Deploy ohne Custom Domain: dk-dk.de zeigt weiterhin per DNS auf
      # den alten WordPress-Host, die Domain steht hier also noch nicht zur
      # Verfügung. GitHub Pages liefert stattdessen unter /website/ aus —
      # deshalb müssen site und base passend gesetzt werden, sonst zeigen
      # alle Asset- und Link-Pfade ins Leere.
      # Für den späteren Go-live: diese beiden env-Zeilen und den
      # CNAME-Schritt unten entfernen, dann greifen die Defaults (dk-dk.de, /).
      - name: Build
        run: npm run build
        env:
          SITE_URL: https://agentur-dk.github.io
          BASE_PATH: /website/

      # public/CNAME würde die Custom Domain auf dk-dk.de setzen und
      # agentur-dk.github.io/website/ dorthin umleiten — also auf die alte
      # Seite. Die Datei bleibt im Repo, nur nicht im Preview-Artefakt.
      - name: CNAME aus dem Preview-Build entfernen
        run: rm -f dist/CNAME

      # Diese drei Prüfungen arbeiten auf dist/ und brauchen keinen Browser.
      - name: Interne Links
        run: npm run check:links

      - name: SEO-Regeln (Titles, Canonicals, JSON-LD, Sitemap)
        run: npm run check:seo

      - name: CSS-Klassen
        run: npm run check:css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
