name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # tools/lastmod.ts liest das Datum des letzten Commits je Seite für
          # die Sitemap. Mit dem Standard-Shallow-Checkout stünde für jede
          # Datei derselbe Zeitpunkt — Google ignoriert solche lastmod-Werte.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typen prüfen
        run: npm run check:types

      - name: Unit-Tests
        run: npm test

      - name: Build
        run: npm run build

      # Diese drei Prüfungen arbeiten auf dist/ und brauchen keinen Browser.
      - name: Interne Links
        run: npm run check:links

      - name: SEO-Regeln (Titles, Canonicals, JSON-LD, Sitemap)
        run: npm run check:seo

      - name: CSS-Klassen
        run: npm run check:css

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
