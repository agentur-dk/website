name: Qualitätsgates (Barrierefreiheit & Performance)

# Läuft nicht bei jedem Push: ein vollständiger Lighthouse-Durchlauf über
# 16 Seiten × 2 Formfaktoren dauert rund zehn Minuten. Deshalb bei Pull
# Requests, wöchentlich und auf Zuruf.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  quality:
    name: axe-core · WCAG 2.2 · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Prüfungen gegen gzip-Server
        # tools/verify-live.mjs startet tools/serve.mjs (bildet die
        # Kompression von GitHub Pages nach) und fährt danach axe-core,
        # die manuellen WCAG-Kriterien und Lighthouse.
        run: node tools/verify-live.mjs

      - name: Lighthouse-Berichte sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouse/
          retention-days: 14
