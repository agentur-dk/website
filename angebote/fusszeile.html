<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="schriften-ttf.css">
<style>
  html,body{margin:0;padding:0;background:#fff;}
  body{font-family:Arial,sans-serif;font-size:7pt;color:#8d949e;}
  .rechts{text-align:right;}
  table{width:100%;border-collapse:collapse;} td{padding:0;}
</style></head>
<body>
<table><tr>
  <td>agentur dk — design &amp; kommunikation</td>
  <td class="rechts">Seite <span id="s"></span> von <span id="g"></span></td>
</tr></table>
<script>
  function param(name) {
    var t = location.search.substring(1).split('&');
    for (var i = 0; i < t.length; i++) {
      var p = t[i].split('=');
      if (decodeURIComponent(p[0]) === name) return decodeURIComponent(p[1] || '');
    }
    return '';
  }
  document.getElementById('s').innerHTML = param('page');
  document.getElementById('g').innerHTML = param('topage');
</script>
</body></html>
